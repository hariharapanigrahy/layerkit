name: Bug report
description: Something is broken in the CLI, install, proposals, or evals
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug. Please search existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, platform (codex/cursor/…), Node version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Layerkit version / commit
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
